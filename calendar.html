<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalendár — Adam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .cal-month-label{font-weight:800;font-size:1.15rem;}
  .cal-nav{display:flex;gap:6px;}
  .cal-nav button{
    width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);
    color:var(--text);font-size:1rem;cursor:pointer;box-shadow:var(--shadow-card);
  }
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-dow{font-family:var(--mono);font-size:0.66rem;color:var(--text-faint);text-align:center;padding-bottom:4px;text-transform:uppercase;}
  .cal-day{
    background:var(--surface);border-radius:12px;box-shadow:var(--shadow-card);
    min-height:58px;padding:6px 6px;cursor:pointer;display:flex;flex-direction:column;
    border:1.5px solid transparent;
  }
  .cal-day.other-month{opacity:0.35;}
  .cal-day.today{border-color:var(--accent);}
  .cal-day-num{font-family:var(--mono);font-size:0.78rem;font-weight:600;}
  .cal-day-dots{display:flex;gap:3px;margin-top:auto;flex-wrap:wrap;}
  .cal-dot{width:6px;height:6px;border-radius:50%;}
  .cal-dot.note{background:var(--accent);}
  .cal-emoji{font-size:0.72rem;line-height:1;}
  .cal-emoji-more{font-family:var(--mono);font-size:0.6rem;color:var(--text-faint);align-self:center;}
  .cal-legend{display:flex;gap:16px;margin-top:12px;font-size:0.74rem;color:var(--text-dim);}
  .cal-legend-item{display:flex;align-items:center;gap:5px;}
  .day-activity-row{padding:8px 0;border-bottom:1px solid var(--line-soft);}
  .day-activity-row:last-child{border-bottom:none;}
  .ai-activity-note{
    background:var(--surface-2);border-radius:10px;padding:8px 10px;margin:6px 0;
    font-size:0.8rem;color:var(--text-dim);line-height:1.5;
  }
  .wellness-comment-box{
    background:var(--surface-2);border-radius:10px;padding:9px 12px;
    font-size:0.82rem;color:var(--text-dim);line-height:1.5;
  }
  .wellness-comment-box .wc-label{font-family:var(--mono);font-size:0.64rem;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;}
  @media (max-width:680px){
    .cal-day{min-height:46px;padding:4px;}
    .cal-grid{gap:4px;}
  }
</style>
</head>
<body>
<div class="wrap" style="max-width:680px;">
  <div class="top-row">
    <div>
      <div class="brand">
        <h1>Kalendár</h1>
      </div>
      <div class="sub" style="color:var(--text-dim);font-size:0.85rem;margin-top:4px;">
        Aktivity + poznámky/plány na konkrétne dni (aj budúce - dostanú sa do rannej AI analýzy).
      </div>
    </div>
  </div>

  <div class="form-card">
    <div class="cal-head">
      <button class="btn" id="btn-prev-month" style="padding:8px 12px;">←</button>
      <span class="cal-month-label" id="cal-month-label"></span>
      <button class="btn" id="btn-next-month" style="padding:8px 12px;">→</button>
    </div>
    <div class="cal-grid" id="cal-dow-row">
      <div class="cal-dow">Po</div><div class="cal-dow">Ut</div><div class="cal-dow">St</div>
      <div class="cal-dow">Št</div><div class="cal-dow">Pi</div><div class="cal-dow">So</div><div class="cal-dow">Ne</div>
    </div>
    <div class="cal-grid" id="cal-grid" style="margin-top:6px;"></div>
    <div class="cal-legend">
      <div class="cal-legend-item">🚴🏃🥾🏊 = typ aktivity</div>
      <div class="cal-legend-item"><span class="cal-dot note"></span> poznámka/plán</div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="day-modal">
  <div class="modal">
    <h3 id="day-modal-date">—</h3>
    <div id="day-modal-activities" style="margin-bottom:14px;"></div>
    <div id="day-modal-wellness-comment" style="display:none;margin-bottom:14px;"></div>
    <div class="field" style="margin-bottom:10px;">
      <span class="field-label">Stav na tento deň (voliteľné, prebije všeobecný Stav)</span>
      <div class="status-options" id="day-modal-status" style="margin-top:6px;">
        <button class="status-opt" data-status="active"><span class="status-opt-icon" style="background:var(--good);">🏃</span><span class="status-opt-label">Aktívny</span></button>
        <button class="status-opt" data-status="sick"><span class="status-opt-icon" style="background:var(--warn);">🤒</span><span class="status-opt-label">Chorý</span></button>
        <button class="status-opt" data-status="injured"><span class="status-opt-icon" style="background:var(--bad);">🤕</span><span class="status-opt-label">Zranený</span></button>
        <button class="status-opt" data-status="break"><span class="status-opt-icon" style="background:var(--data);">🧘</span><span class="status-opt-label">Pauza</span></button>
      </div>
    </div>
    <div class="field" style="margin-bottom:14px;">
      <span class="field-label">Poznámka / plán na tento deň</span>
      <textarea id="day-modal-note" rows="3" style="width:100%;" placeholder="napr. idem na túru, chcem voľno, preteky..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="cancel" id="day-modal-cancel">Zrušiť</button>
      <button class="save" id="day-modal-save">Uložiť</button>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="index.html"><span class="bn-icon">📊</span>Dashboard</a>
  <a href="history.html"><span class="bn-icon">🗓</span>História</a>
  <a href="checkin.html"><span class="bn-icon">📝</span>Check-in</a>
  <a href="power.html"><span class="bn-icon">⚡</span>Výkon</a>
  <a href="calendar.html" class="active"><span class="bn-icon">📅</span>Kalendár</a>
  <a href="plan.html"><span class="bn-icon">🌦️</span>Plán</a>
</nav>

<script src="app-common.js"></script>
<script>
const REPO_OWNER = 'xsklencik';
const REPO_NAME = 'recovery';
function getToken(){ return localStorage.getItem('gh_pat') || ''; }
const NOTES_URL = 'data/day_notes.json';
const ANALYSES_URL = 'data/activity_analyses.json';
const ANALYZE_WORKFLOW_FILE = 'analyze-activity.yml';

const DOW_MON0 = d => (d.getDay() + 6) % 7; // 0=Pondelok

const ACTIVITY_EMOJI = {
  Ride: '🚴', VirtualRide: '🚴', MountainBikeRide: '🚵', GravelRide: '🚴',
  Run: '🏃', TrailRun: '🏃', VirtualRun: '🏃',
  Hike: '🥾', Walk: '🥾',
  Swim: '🏊', OpenWaterSwim: '🏊',
  Badminton: '🏸', Soccer: '⚽', Workout: '🏋️', WeightTraining: '🏋️',
};
function emojiForActivity(a){ return ACTIVITY_EMOJI[a.type] || '⚫'; }

async function runActivityAnalysis(activityId, btn){
  const token = getToken();
  if(!token){ alert('Chýba GitHub token - nastav ho tlačidlom Token na Dashboarde.'); return; }
  const statusEl = btn.nextElementSibling;
  btn.disabled = true;
  statusEl.textContent = '⏳ Spúšťam...';
  try{
    const dispatchRes = await fetch(
      `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/workflows/${ANALYZE_WORKFLOW_FILE}/dispatches`,
      {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json',
          'X-GitHub-Api-Version': '2022-11-28',
        },
        body: JSON.stringify({ ref: 'main', inputs: { activity_id: activityId } }),
      }
    );
    if(!dispatchRes.ok){
      const txt = await dispatchRes.text();
      throw new Error(`GitHub API ${dispatchRes.status}: ${txt.slice(0,150)}`);
    }
    const beforeGeneratedAt = ANALYSES[activityId] ? ANALYSES[activityId].generatedAt : null;
    let done = false;
    for(let i=0;i<25;i++){
      statusEl.textContent = `⏳ Generujem... (${(i+1)*8}s)`;
      await new Promise(r=>setTimeout(r, 8000));
      const check = await loadJson(ANALYSES_URL);
      if(check && check[activityId] && check[activityId].generatedAt !== beforeGeneratedAt){
        ANALYSES = check;
        done = true;
        break;
      }
    }
    if(done){
      statusEl.textContent = '✅ Hotovo';
      openDayModal(currentModalDate); // prekresli s novým hodnotením
    } else {
      statusEl.textContent = '⚠️ Trvá to dlhšie, skús o chvíľu obnoviť stránku';
    }
  }catch(e){
    statusEl.textContent = '⚠️ ' + e.message;
  }finally{
    btn.disabled = false;
  }
}

let cursor = new Date();
cursor.setDate(1);
let ACTIVITIES_BY_DATE = new Map();
let NOTES_BY_DATE = new Map();
let notesRaw = [];
let ANALYSES = {};

const MONTH_NAMES = ['Január','Február','Marec','Apríl','Máj','Jún','Júl','August','September','Október','November','December'];

let WELLNESS_BY_DATE = new Map();

async function loadData(){
  const [actHist, actDaily, notes, analyses, wHist, wDaily] = await Promise.all([
    loadJson('data/activities_history.json'), loadJson('data/activities_daily.json'), loadJson(NOTES_URL),
    loadJson('data/activity_analyses.json'),
    loadJson('data/wellness_history.json'), loadJson('data/wellness_daily.json'),
  ]);
  const acts = mergeById(actHist||[], actDaily||[]);
  ACTIVITIES_BY_DATE = new Map();
  acts.forEach(a=>{
    if(!ACTIVITIES_BY_DATE.has(a.date)) ACTIVITIES_BY_DATE.set(a.date, []);
    ACTIVITIES_BY_DATE.get(a.date).push(a);
  });
  notesRaw = notes || [];
  NOTES_BY_DATE = new Map(notesRaw.map(n=>[n.date, n]));
  ANALYSES = analyses || {};
  const wellness = mergeById(wHist||[], wDaily||[]);
  WELLNESS_BY_DATE = new Map(wellness.map(w=>[w.date, w]));
  renderCalendar();
}

function renderCalendar(){
  document.getElementById('cal-month-label').textContent = MONTH_NAMES[cursor.getMonth()] + ' ' + cursor.getFullYear();
  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';
  const firstOfMonth = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
  const startOffset = DOW_MON0(firstOfMonth);
  const gridStart = new Date(firstOfMonth);
  gridStart.setDate(gridStart.getDate() - startOffset);
  const todayStr = todayISO();

  for(let i=0;i<42;i++){
    const d = new Date(gridStart);
    d.setDate(d.getDate()+i);
    const dateStr = localDateStr(d);
    const isOtherMonth = d.getMonth() !== cursor.getMonth();
    const cell = document.createElement('div');
    cell.className = 'cal-day' + (isOtherMonth ? ' other-month' : '') + (dateStr===todayStr ? ' today' : '');
    const dayActs = ACTIVITIES_BY_DATE.get(dateStr) || [];
    const hasNote = NOTES_BY_DATE.has(dateStr) && NOTES_BY_DATE.get(dateStr).note && NOTES_BY_DATE.get(dateStr).note.trim();
    const emojiHtml = dayActs.slice(0,2).map(a=>`<span class="cal-emoji">${emojiForActivity(a)}</span>`).join('')
      + (dayActs.length>2 ? `<span class="cal-emoji-more">+${dayActs.length-2}</span>` : '');
    cell.innerHTML = `
      <span class="cal-day-num">${d.getDate()}</span>
      <div class="cal-day-dots">
        ${emojiHtml}
        ${hasNote ? '<span class="cal-dot note"></span>' : ''}
      </div>
    `;
    cell.addEventListener('click', ()=> openDayModal(dateStr));
    grid.appendChild(cell);
    // po 6. stĺpci (nedeľa, index 6,13,20...) netreba nič extra, grid je 7-stĺpcový CSS grid
  }
}

document.getElementById('btn-prev-month').addEventListener('click', ()=>{
  cursor.setMonth(cursor.getMonth()-1);
  renderCalendar();
});
document.getElementById('btn-next-month').addEventListener('click', ()=>{
  cursor.setMonth(cursor.getMonth()+1);
  renderCalendar();
});

let currentModalDate = null;

function activityRowHtml(a){
  const analysis = ANALYSES[a.id];
  return `
    <div class="day-activity-row" data-activity-id="${escapeHtml(String(a.id))}">
      <div style="font-size:0.85rem;margin-bottom:4px;">
        ${emojiForActivity(a)} ${escapeHtml(a.name||a.type||'Aktivita')}${a.moving_time ? ' · ' + Math.round(a.moving_time/60) + ' min' : ''}${a.icu_training_load ? ' · load ' + Math.round(a.icu_training_load) : ''}
      </div>
      ${analysis ? `<div class="ai-activity-note">${escapeHtml(analysis.text)}</div>` : ''}
      <button class="btn-analyze-activity" data-activity-id="${escapeHtml(String(a.id))}" style="font-size:0.72rem;color:var(--accent);background:none;border:none;cursor:pointer;padding:2px 0;font-family:var(--sans);font-weight:600;">
        ${analysis ? '🔄 Prehodnotiť' : '🧠 AI hodnotenie'}
      </button>
      <span class="analyze-status" style="font-size:0.72rem;color:var(--text-faint);margin-left:6px;"></span>
    </div>
  `;
}

let selectedDayStatus = null;

function openDayModal(dateStr){
  currentModalDate = dateStr;
  document.getElementById('day-modal-date').textContent = dateStr;
  const acts = ACTIVITIES_BY_DATE.get(dateStr) || [];
  const actBox = document.getElementById('day-modal-activities');
  if(acts.length){
    actBox.innerHTML = '<div class="field-label" style="margin-bottom:6px;">Aktivity toho dňa</div>' +
      acts.map(activityRowHtml).join('<div style="height:10px;"></div>');
    actBox.querySelectorAll('.btn-analyze-activity').forEach(btn=>{
      btn.addEventListener('click', ()=> runActivityAnalysis(btn.dataset.activityId, btn));
    });
  } else {
    actBox.innerHTML = '<div class="field-label">Žiadna zaznamenaná aktivita tento deň.</div>';
  }

  // Komentár z wellness dát (zapísaný cez checkin.html alebo detail dňa na Dashboarde) - zlúčený
  // sem ako kontext, len na zobrazenie (edituje sa inde, Intervals.icu API, nie odtiaľto).
  const wellnessRec = WELLNESS_BY_DATE.get(dateStr);
  const wcBox = document.getElementById('day-modal-wellness-comment');
  if(wellnessRec && wellnessRec.comments && wellnessRec.comments.trim()){
    wcBox.style.display = 'block';
    wcBox.innerHTML = `<div class="wellness-comment-box"><div class="wc-label">Komentár dňa (z Dashboardu/check-inu)</div>${escapeHtml(wellnessRec.comments)}</div>`;
  } else {
    wcBox.style.display = 'none';
    wcBox.innerHTML = '';
  }

  const existing = NOTES_BY_DATE.get(dateStr);
  document.getElementById('day-modal-note').value = existing ? (existing.note || '') : '';
  selectedDayStatus = existing && existing.status ? existing.status : null;
  document.querySelectorAll('#day-modal-status .status-opt').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.status === selectedDayStatus);
  });
  document.getElementById('day-modal').classList.add('show');
}
document.querySelectorAll('#day-modal-status .status-opt').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    // Klik na už vybraný stav ho zruší (deň nemá vlastný override, použije sa všeobecný Stav).
    selectedDayStatus = (selectedDayStatus === btn.dataset.status) ? null : btn.dataset.status;
    document.querySelectorAll('#day-modal-status .status-opt').forEach(b=>{
      b.classList.toggle('active', b.dataset.status === selectedDayStatus);
    });
  });
});
document.getElementById('day-modal-cancel').addEventListener('click', ()=>{
  document.getElementById('day-modal').classList.remove('show');
});

async function saveDayNote(dateStr, note, status){
  const token = getToken();
  if(!token) throw new Error('Chýba GitHub token (Token tlačidlo na Dashboarde).');
  const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/data/day_notes.json`;
  let sha = null, existing = [];
  const getRes = await fetch(apiUrl + '?t=' + Date.now(), {
    headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json' },
  });
  if(getRes.ok){
    const j = await getRes.json();
    sha = j.sha;
    try{ existing = JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,''))))); }catch(e){ existing = []; }
  }
  const idx = existing.findIndex(n=>n.date===dateStr);
  const isEmpty = note.trim()==='' && !status;
  if(isEmpty){
    if(idx>=0) existing.splice(idx,1); // prázdna poznámka AJ žiadny stav = zmazať záznam
  } else {
    const entry = { date: dateStr, note, status: status || undefined, updatedAt: new Date().toISOString() };
    if(idx>=0) existing[idx] = entry; else existing.push(entry);
  }
  const content = JSON.stringify(existing, null, 1);
  const b64 = btoa(unescape(encodeURIComponent(content)));
  const putRes = await fetch(apiUrl, {
    method: 'PUT',
    headers: {
      'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
    },
    body: JSON.stringify({ message: `Update day note: ${dateStr}`, content: b64, sha: sha || undefined, branch: 'main' }),
  });
  if(!putRes.ok){
    const txt = await putRes.text();
    throw new Error(`GitHub API ${putRes.status}: ${txt.slice(0,150)}`);
  }
  return existing;
}

document.getElementById('day-modal-save').addEventListener('click', async ()=>{
  const btn = document.getElementById('day-modal-save');
  const note = document.getElementById('day-modal-note').value;
  btn.textContent = 'Ukladám…'; btn.disabled = true;
  try{
    const all = await saveDayNote(currentModalDate, note, selectedDayStatus);
    notesRaw = all;
    NOTES_BY_DATE = new Map(all.map(n=>[n.date, n]));
    document.getElementById('day-modal').classList.remove('show');
    renderCalendar();
  }catch(e){
    alert('Chyba pri ukladaní: ' + e.message);
  }finally{
    btn.textContent = 'Uložiť'; btn.disabled = false;
  }
});

loadData();
</script>
</body>
</html>
