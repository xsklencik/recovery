name: Weather Plan

on:
  workflow_dispatch:
    inputs:
      edit_instruction:
        description: 'Pokyn na úpravu EXISTUJÚCEHO plánu (napr. "skráť dnešný tréning na 60 minút"). Nechaj prázdne pre bežné vygenerovanie nového plánu.'
        required: false
        default: ''
      current_selection:
        description: 'Interné - JSON mapa dátum->index aktuálne vybranej alternatívy z prehliadača (posiela plan.html automaticky, nevypĺňaj ručne).'
        required: false
        default: ''
      question:
        description: 'Otázka pre AI kouča (napr. "koľko vody si mám vziať?") - odpovie bez toho, aby menila plán. Nechaj prázdne pre generovanie/úpravu.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Vygeneruj alebo uprav plán podľa počasia
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PLAN_EDIT_INSTRUCTION: ${{ github.event.inputs.edit_instruction }}
          PLAN_CURRENT_SELECTION: ${{ github.event.inputs.current_selection }}
          PLAN_QUESTION: ${{ github.event.inputs.question }}
        run: node weather-plan.js
      - name: Commit a push výsledok
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f data/weather_plan.json ]; then git add data/weather_plan.json; fi
          if ! git diff --staged --quiet; then
            git commit -m "Weather plan $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
